plugins {
    alias(libs.plugins.shadow)
}

// Toolchain / dual-target (modern syntax -> Java 8 bytecode) is configured in the root build.

repositories {
    // EssentialsX ships here as an internal fork with no public coordinate; it is the only real
    // provider of the per-player ignore list, so the jar rides along in libs/.
    flatDir {
        dirs rootProject.file('libs')
    }
}

dependencies {
    implementation project(':common')

    // Provided at runtime by the server (the EverNifeCore plugin). The minecraft artifact is a
    // shaded fat jar that already carries the common API, so no separate evernifecore-common here.
    compileOnly 'br.com.finalcraft:evernifecore-minecraft:3.0.1'
    compileOnly 'org.spigotmc:spigot-api:1.19.2-R0.1-SNAPSHOT'

    compileOnly name: "EssentialsX-2.15.0.evernife.v1b"
}

shadowJar {
    archiveBaseName.set('FinalChat')
    archiveClassifier.set('')
    // Bundle only our own ':common' module. EverNifeCore stays external (compileOnly).
}

// Only the shaded jar is deployable; drop the thin jar (it lacks :common) to avoid confusion.
tasks.named('jar') {
    enabled = false
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

processResources {
    filesMatching('plugin.yml') {
        expand version: project.version
    }
}
